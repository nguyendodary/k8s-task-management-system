apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: task-management
data:
  # Backend configuration
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "taskmanagement"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  JWT_EXPIRES_IN: "24h"
  
  # Frontend configuration
  VITE_API_URL: "/api"
