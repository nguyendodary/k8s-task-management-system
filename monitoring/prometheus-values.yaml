server:
  enabled: true
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: ""
  retention: "30d"
  retentionSize: "8GB"
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  service:
    type: ClusterIP

alertmanager:
  enabled: true
  persistentVolume:
    enabled: true
    size: 5Gi
  config:
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alertmanager@example.com'
    route:
      receiver: 'default'
    receivers:
    - name: 'default'
      email_configs:
      - to: 'admin@example.com'
        subject: 'Alert: {{ .GroupLabels.alertname }}'
        body: 'Alert details: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

nodeExporter:
  enabled: true
  resources:
    requests:
      memory: "50Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

kubeStateMetrics:
  enabled: true

pushgateway:
  enabled: false

extraScrapeConfigs: |
  - job_name: 'task-management-backend'
    static_configs:
      - targets: ['backend.task-management.svc.cluster.local:5000']
    metrics_path: /metrics
    scrape_interval: 30s
